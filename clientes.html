<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUCOR | Clientes</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="clientes.css" />
  </head>

  <body>
    <div class="estructura-principal">
      <aside class="barra-lateral" aria-label="Navegación principal">
        <header class="encabezado">
          <h1>PUCOR</h1>
          <p>Reparación y Mantención de Máquinas de Frío</p>
        </header>

        <nav class="menu">
          <a href="index.html">Calendario de Citas</a>

          <details class="grupo-menu" open>

            <summary class="opcion-activa">Clientes</summary>

            <div class="submenu-clientes">
              <a href="clientes.html" class="subopcion-activa">
                Registro de clientes
              </a>

              <a href="Clientes_Registrados/registrados.html">
                Clientes registrados
              </a>
            </div>
          </details>

          <a href="Costo_Utilidades/trabajos.html">Control de Trabajos</a>
        </nav>
      </aside>

      <div class="contenido-principal">
        <main class="contenedor clientes-contenedor">
          <section class="contenido-clientes">
            <h2>Registro de Clientes</h2>
            <p>Administración de clientes de PUCOR.</p>

            <form id="formCliente">
              <label for="nombreCliente">Nombre o razón social</label>
              <input
                type="text"
                id="nombreCliente"
                required
                placeholder="Nombre del cliente"
              />

              <label for="telefonoCliente">Teléfono</label>
              <input
                type="tel"
                id="telefonoCliente"
                required
                placeholder="+56 9 1234 5678"
              />

              <label for="correoCliente">Correo electrónico</label>
              <input
                type="email"
                id="correoCliente"
                placeholder="correo@ejemplo.cl"
              />

              <label for="direccionCliente">Dirección</label>
              <input
                type="text"
                id="direccionCliente"
                required
                placeholder="Dirección del cliente"
              />

              <button type="submit">Guardar cliente</button>
            </form>

            <div hidden>
              <input type="search" id="buscarCliente" />
              <div id="listaClientes"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="clientes.js"></script>
  </body>
</html>
